name: Release

# Запуск: вкладка Actions -> Release -> Run workflow, либо тег вида v1.0.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Версия, например 1.0.0'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Version name
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=${{ github.event.inputs.version_name }}" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Не заданы секреты KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (Settings -> Secrets and variables -> Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build signed release (APK and AAB)
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -n5

      - name: Rename files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/NovayaZhizn-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/NovayaZhizn-${VERSION_NAME}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: NovayaZhizn-release
          path: dist/*

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
